<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI视频分析 - 上传页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            color: #667eea;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #888;
            font-size: 0.9rem;
        }
        
        #fileInput {
            display: none;
        }
        
        .selected-file {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-icon {
            font-size: 2rem;
            color: #667eea;
        }
        
        .file-details h4 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .file-details p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .options {
            margin-bottom: 30px;
        }
        
        .option-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .secondary-btn {
            background: #f0f4ff;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .secondary-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .result-area {
            margin-top: 30px;
            display: none;
        }
        
        .result-box {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #667eea;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .pricing {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            margin-top: 40px;
            text-align: center;
        }
        
        .pricing h3 {
            margin-bottom: 10px;
        }
        
        .pricing p {
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎬 AI视频分析</div>
            <div class="subtitle">上传视频，AI智能分析内容，生成总结报告</div>
        </div>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽视频文件到此处</div>
            <div class="upload-hint">支持 MP4、AVI、MOV、MKV 格式，最大 500MB</div>
        </div>
        
        <input type="file" id="fileInput" accept="video/*" onchange="handleFileSelect(event)">
        
        <div class="selected-file" id="selectedFile">
            <div class="file-info">
                <div class="file-icon">🎥</div>
                <div class="file-details">
                    <h4 id="fileName">未选择文件</h4>
                    <p id="fileSize">文件大小: --</p>
                </div>
            </div>
        </div>
        
        <div class="options">
            <div class="option-group">
                <label for="analysisType">分析类型</label>
                <select id="analysisType">
                    <option value="basic">基础总结（免费）</option>
                    <option value="professional">专业分析（需升级）</option>
                    <option value="academic">学术分析（需升级）</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="language">分析语言</label>
                <select id="language">
                    <option value="zh">中文</option>
                    <option value="en">英文</option>
                </select>
            </div>
        </div>
        
        <div class="button-group">
            <button class="secondary-btn" onclick="clearSelection()">清除选择</button>
            <button class="primary-btn" onclick="uploadVideo()">开始分析</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在上传并分析视频，请稍候...</p>
        </div>
        
        <div class="result-area" id="resultArea">
            <h3>分析结果</h3>
            <div class="result-box" id="resultContent">
                <!-- 结果将在这里显示 -->
            </div>
        </div>
        
        <div class="pricing">
            <h3>💰 定价方案</h3>
            <p>• 基础版：免费，每日10次分析</p>
            <p>• VIP版：9.9元/月，每日50次</p>
            <p>• 专业版：29.9元/月，无限次+高级功能</p>
        </div>
    </div>

    <script>
        let selectedFile = null;
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 检查文件类型
            if (!file.type.startsWith('video/')) {
                alert('请选择视频文件！');
                return;
            }
            
            // 检查文件大小 (最大500MB)
            if (file.size > 500 * 1024 * 1024) {
                alert('文件太大，最大支持500MB！');
                return;
            }
            
            selectedFile = file;
            
            // 显示文件信息
            document.getElementById('selectedFile').style.display = 'block';
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = `文件大小: ${formatFileSize(file.size)}`;
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function clearSelection() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('selectedFile').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';
        }
        
        async function uploadVideo() {
            if (!selectedFile) {
                alert('请先选择视频文件！');
                return;
            }
            
            // 显示加载动画
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('analysis_type', document.getElementById('analysisType').value);
            formData.append('language', document.getElementById('language').value);
            
            try {
                const response = await fetch('/api/upload/minimal', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                // 隐藏加载动画
                document.getElementById('loading').style.display = 'none';
                
                if (result.success) {
                    // 显示结果
                    document.getElementById('resultArea').style.display = 'block';
                    document.getElementById('resultContent').innerHTML = `
                        <h4>✅ 上传成功！</h4>
                        <p>文件：${selectedFile.name}</p>
                        <p>大小：${formatFileSize(selectedFile.size)}</p>
                        <p>分析类型：${document.getElementById('analysisType').options[document.getElementById('analysisType').selectedIndex].text}</p>
                        <p>临时链接：${result.data.temp_url || '已生成'}</p>
                        <p>处理状态：${result.data.status}</p>
                        ${result.data.ai_result ? `<div style="margin-top:15px;padding:10px;background:#e8f4ff;border-radius:5px;">
                            <strong>AI分析结果：</strong><br>${result.data.ai_result}
                        </div>` : ''}
                    `;
                    
                    // 如果是专业功能，提示升级
                    const analysisType = document.getElementById('analysisType').value;
                    if (analysisType !== 'basic') {
                        setTimeout(() => {
                            alert('🔒 专业功能需要升级到专业版\n\n点击下方定价方案了解更多');
                        }, 500);
                    }
                } else {
                    alert('上传失败：' + (result.error || '未知错误'));
                }
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert('网络错误：' + error.message);
            }
        }
        
        // 拖拽上传支持
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f8f9ff';
            uploadArea.style.borderColor = '#764ba2';
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            uploadArea.style.borderColor = '#667eea';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            uploadArea.style.borderColor = '#667eea';
            
            const file = e.dataTransfer.files[0];
            if (file) {
                // 模拟文件选择
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                document.getElementById('fileInput').files = dataTransfer.files;
                
                // 触发change事件
                const event = new Event('change', { bubbles: true });
                document.getElementById('fileInput').dispatchEvent(event);
            }
        });
    </script>
</body>
</html>
